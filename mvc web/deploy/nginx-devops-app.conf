# Nginx reverse proxy for the Linux deployment.
# Install at: /etc/nginx/sites-available/devops-app
# Enable:     sudo ln -s /etc/nginx/sites-available/devops-app /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name your-domain.example.com;   # <-- change to your domain / IP

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# For HTTPS, run certbot to obtain a Let's Encrypt certificate:
#   sudo certbot --nginx -d your-domain.example.com

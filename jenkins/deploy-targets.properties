# ---------------------------------------------------------------------------
# Deploy targets, one block per branch.
#
# resolveSetting() in the Jenkinsfile takes the FIRST non-empty hit of:
#
#   1. Jenkins environment   <KEY>_<BRANCH>     e.g. WEB_DEPLOY_PATH_DEV
#   2. Jenkins environment   <KEY>              e.g. WEB_DEPLOY_PATH
#   3. this file             <KEY>_<BRANCH>
#   4. this file             <KEY>
#
# So: a branch block beats the shared defaults at the bottom, and anything set
# in Jenkins beats this file entirely - which is what you want for a one-off
# override, or for a path you would rather not commit.
#
# <BRANCH> is the branch name upper-cased, with every character that is not a
# letter or a digit replaced by an underscore:
#
#   dev          ->  DEV
#   staging      ->  STAGING
#   hotfix       ->  HOTFIX
#   release/1.2  ->  RELEASE_1_2
#
# Only branches listed in DEPLOY_BRANCHES (Jenkinsfile `environment` block) may
# deploy at all; every other branch is CI-only, whatever this file says.
#
# Format notes:
#   - Backslashes are literal. The Jenkinsfile parses this by hand instead of
#     with readProperties precisely so D:\DevOps\... survives intact.
#   - Everything after the first `=` is the value, trimmed. No quotes, no
#     trailing comments, no ${...} expansion.
#   - `#` or `;` in the first column comments a line out.
# ---------------------------------------------------------------------------


# === dev ===================================================================
WEB_DEPLOY_PATH_DEV=D:\DevOps\dev\web
API_DEPLOY_PATH_DEV=D:\DevOps\dev\api
SSO_DEPLOY_PATH_DEV=D:\DevOps\dev\sso
SVC_DEPLOY_PATH_DEV=D:\DevOps\dev\svc
SVC_SERVICE_NAME_DEV=MyWindowsService.Dev


# === staging ===============================================================
WEB_DEPLOY_PATH_STAGING=D:\DevOps\staging\web
API_DEPLOY_PATH_STAGING=D:\DevOps\staging\api
SSO_DEPLOY_PATH_STAGING=D:\DevOps\staging\sso
SVC_DEPLOY_PATH_STAGING=D:\DevOps\staging\svc
SVC_SERVICE_NAME_STAGING=MyWindowsService.Staging


# === hotfix ================================================================
# A remote target looks like this. Set DEPLOY_CREDENTIALS_ID on the job (a
# Jenkins username/password credential) and deploy-app.ps1 will `net use` the
# share before robocopy and disconnect afterwards.
#WEB_DEPLOY_PATH_HOTFIX=\\prod-web-01\deploy\web
WEB_DEPLOY_PATH_HOTFIX=D:\DevOps\hotfix\web
API_DEPLOY_PATH_HOTFIX=D:\DevOps\hotfix\api
SSO_DEPLOY_PATH_HOTFIX=D:\DevOps\hotfix\sso
SVC_DEPLOY_PATH_HOTFIX=D:\DevOps\hotfix\svc
SVC_SERVICE_NAME_HOTFIX=MyWindowsService


# === shared defaults =======================================================
# No branch suffix: used by any branch without its own entry above. Keep only
# settings that are genuinely the same everywhere here - a deploy PATH that
# silently applies to every branch is how staging ends up overwriting prod.
WEB_EXCLUDE_FILES=appsettings.json,appsettings.*.json
API_EXCLUDE_FILES=appsettings.json,appsettings.*.json
SSO_EXCLUDE_FILES=appsettings.json,appsettings.*.json
SVC_EXCLUDE_FILES=appsettings.json,appsettings.*.json

WEB_EXCLUDE_DIRS=uploads
API_EXCLUDE_DIRS=uploads
SSO_EXCLUDE_DIRS=uploads
SVC_EXCLUDE_DIRS=

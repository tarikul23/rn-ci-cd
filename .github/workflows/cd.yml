name: CD

# ---------------------------------------------------------------------------
# Continuous Deployment
# Fires automatically after the CI workflow succeeds on `main`, or manually
# via the Actions tab (workflow_dispatch) where you can pick a target project.
#
# Only the projects that actually changed get published and deployed:
#   - only mvc web/**  changed  -> deploy Web only
#   - only web api/**  changed  -> deploy API only
#   - Domain/**        changed  -> deploy BOTH (Web + API depend on Domain)
#   - neither changed           -> nothing to deploy (jobs are skipped)
#
# Flow: detect-changes -> publish (changed projects) -> deploy-windows.
# All server credentials come from GitHub Secrets (never hard-coded).
# ---------------------------------------------------------------------------

on:
  # Run only after CI finished successfully.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger: force-deploy a specific project regardless of git diff.
  workflow_dispatch:
    inputs:
      projects:
        description: 'Which project(s) to deploy'
        required: true
        default: 'both'
        type: choice
        options: [web, api, both]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never interrupt an in-flight deploy

# The manual-approval gate opens/closes a tracking issue, so the workflow
# token needs write access to issues.
permissions:
  contents: read
  issues: write

env:
  DOTNET_VERSION: '10.0.x'          # keep in sync with ci.yml / the projects
  DOTNET_CONFIGURATION: 'Release'
  MVC_PROJECT: 'mvc web/DevOps.csproj'
  API_PROJECT: 'web api/web api.csproj'
  MVC_ARTIFACT: 'app-publish-mvc'
  API_ARTIFACT: 'app-publish-api'
  # FALLBACK approver list. Normally the `approvers` job resolves this
  # automatically from the repo's collaborators, so ANY repo user can approve.
  # This env is only used if that API lookup fails. Keep at least the owner.
  APPROVERS: 'tarikul23'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  # -------------------------------------------------------------------------
  # 0. DETECT CHANGES — decide which projects need deploying.
  #    * workflow_dispatch  -> honour the operator's `projects` choice.
  #    * workflow_run (auto) -> diff the pushed commit against its parent.
  #      Merge/squash commits to main yield the full PR diff via the first
  #      parent, so PR-based workflows detect all changed files.
  #      A change under Domain/ marks BOTH web and api as needing deploy.
  # -------------------------------------------------------------------------
  detect-changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    # Skip entirely if CI was triggered but did NOT succeed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      web: ${{ steps.decide.outputs.web }}
      api: ${{ steps.decide.outputs.api }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Full history so we can diff against the parent commit.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Decide which projects changed
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          web=false
          api=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: the operator explicitly chose the target(s).
            case "${{ github.event.inputs.projects }}" in
              web)  web=true ;;
              api)  api=true ;;
              both) web=true; api=true ;;
            esac
          else
            # Auto run: compare the pushed commit against its first parent.
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || echo '')"

            if [ -z "$BASE_SHA" ]; then
              # No parent (very first commit) — deploy everything.
              web=true; api=true
            else
              CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
              echo "Changed files:"
              echo "$CHANGED"

              # A change in the shared Domain project fans out to BOTH apps,
              # since Web and API both depend on it.
              domain=false
              echo "$CHANGED" | grep -q '^Domain/'  && domain=true || true
              echo "$CHANGED" | grep -q '^mvc web/' && web=true    || true
              echo "$CHANGED" | grep -q '^web api/' && api=true    || true

              if [ "$domain" = "true" ]; then
                web=true
                api=true
              fi
            fi
          fi

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploy Web=$web  Deploy API=$api"

  # -------------------------------------------------------------------------
  # 1. PUBLISH — build only the changed projects and store them as artifacts.
  # -------------------------------------------------------------------------
  publish:
    name: Publish
    needs: detect-changes
    runs-on: ubuntu-latest
    if: >-
      needs.detect-changes.outputs.web == 'true' ||
      needs.detect-changes.outputs.api == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Framework-dependent publish (the target host has the ASP.NET runtime).
      - name: Publish MVC app
        if: needs.detect-changes.outputs.web == 'true'
        run: >-
          dotnet publish "$MVC_PROJECT"
          --configuration $DOTNET_CONFIGURATION
          --output ./publish/mvc

      - name: Publish Web API
        if: needs.detect-changes.outputs.api == 'true'
        run: >-
          dotnet publish "$API_PROJECT"
          --configuration $DOTNET_CONFIGURATION
          --output ./publish/api

      - name: Upload MVC artifact
        if: needs.detect-changes.outputs.web == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MVC_ARTIFACT }}
          path: ./publish/mvc
          retention-days: 7

      - name: Upload API artifact
        if: needs.detect-changes.outputs.api == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT }}
          path: ./publish/api
          retention-days: 7

  # -------------------------------------------------------------------------
  # 2a0. RESOLVE APPROVERS — so ANY user with repo access can approve without
  #      hand-maintaining a username list. Pulls the repo's collaborators via
  #      the GitHub API; falls back to the static APPROVERS env if the API
  #      call is denied (e.g. token lacks collaborator-read on this repo).
  # -------------------------------------------------------------------------
  approvers:
    name: Resolve approvers
    needs: detect-changes
    runs-on: ubuntu-latest
    if: >-
      needs.detect-changes.outputs.web == 'true' ||
      needs.detect-changes.outputs.api == 'true'
    outputs:
      list: ${{ steps.resolve.outputs.list }}
    steps:
      - name: List repository collaborators
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every collaborator (owner + invited users) may approve.
          users="$(gh api --paginate "repos/${{ github.repository }}/collaborators" \
                     --jq '.[].login' 2>/dev/null | paste -sd, - || true)"
          if [ -z "$users" ]; then
            echo "Could not read collaborators — falling back to APPROVERS env."
            users="${{ env.APPROVERS }}"
          fi
          echo "list=$users" >> "$GITHUB_OUTPUT"
          echo "::notice::Approvers = $users"

  # -------------------------------------------------------------------------
  # 2a. APPROVE WEB — manual gate. Opens a tracking issue and pauses until an
  #     approver comments "approved". Runs on a hosted runner (no need to tie
  #     up the self-hosted box while waiting). Only fires when Web changed.
  # -------------------------------------------------------------------------
  approve-web:
    name: Approve Web deploy
    needs: [detect-changes, publish, approvers]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - name: Wait for manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ needs.approvers.outputs.list }}
          minimum-approvals: 1
          issue-title: "Deploy approval required: Web → IIS"
          issue-body: >-
            A **Web** deployment is waiting for approval
            (run ${{ github.run_id }}, commit ${{ github.sha }}).
            Comment **approved** to deploy, or **denied** to cancel.
          exclude-workflow-initiator-as-approver: false

  # -------------------------------------------------------------------------
  # 2b. DEPLOY WEB (IIS) — self-hosted runner on the target machine.
  #     Runs only after approve-web succeeds. Skipped if Web didn't change.
  # -------------------------------------------------------------------------
  deploy-web:
    name: Deploy Web → IIS (self-hosted)
    needs: [detect-changes, publish, approve-web]
    runs-on: [self-hosted, windows]
    if: needs.detect-changes.outputs.web == 'true'
    env:
      MVC_DEPLOY_PATH: 'D:\DevOps\test'
    steps:
      - name: Download MVC artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MVC_ARTIFACT }}
          path: .\publish\mvc

      # Override the shell command so the runner's execution policy can't block
      # the unsigned temp script GitHub generates from this run: block.
      - name: Deploy MVC to IIS
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path ".\publish\mvc").Path
          New-Item -ItemType Directory -Force -Path $env:MVC_DEPLOY_PATH | Out-Null
          # /MIR mirrors and removes stale files. Add /XF appsettings.Production.json to keep server secrets.
          robocopy $source $env:MVC_DEPLOY_PATH /MIR /NFL /NDL /NJH /NJS /NP /R:3 /W:5
          # robocopy exit codes 0-7 are success; >=8 is a real failure.
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $env:MVC_DEPLOY_PATH with exit code $LASTEXITCODE" }
          Write-Host "Deployed MVC to $env:MVC_DEPLOY_PATH"
          exit 0

  # -------------------------------------------------------------------------
  # 2c. APPROVE API — manual gate (its own approvers). Only fires when the
  #     API changed. A Domain change trips both gates -> two separate issues.
  # -------------------------------------------------------------------------
  approve-api:
    name: Approve API deploy
    needs: [detect-changes, publish, approvers]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.api == 'true'
    steps:
      - name: Wait for manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ needs.approvers.outputs.list }}
          minimum-approvals: 1
          issue-title: "Deploy approval required: API → IIS"
          issue-body: >-
            An **API** deployment is waiting for approval
            (run ${{ github.run_id }}, commit ${{ github.sha }}).
            Comment **approved** to deploy, or **denied** to cancel.
          exclude-workflow-initiator-as-approver: false

  # -------------------------------------------------------------------------
  # 2d. DEPLOY API (IIS) — self-hosted runner on the target machine.
  #     Runs only after approve-api succeeds. Skipped if the API didn't change.
  # -------------------------------------------------------------------------
  deploy-api:
    name: Deploy API → IIS (self-hosted)
    needs: [detect-changes, publish, approve-api]
    runs-on: [self-hosted, windows]
    if: needs.detect-changes.outputs.api == 'true'
    env:
      API_DEPLOY_PATH: 'D:\DevOps\api'
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT }}
          path: .\publish\api

      - name: Deploy API to IIS
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path ".\publish\api").Path
          New-Item -ItemType Directory -Force -Path $env:API_DEPLOY_PATH | Out-Null
          robocopy $source $env:API_DEPLOY_PATH /MIR /NFL /NDL /NJH /NJS /NP /R:3 /W:5
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $env:API_DEPLOY_PATH with exit code $LASTEXITCODE" }
          Write-Host "Deployed API to $env:API_DEPLOY_PATH"
          exit 0

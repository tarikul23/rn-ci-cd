name: CD

# ---------------------------------------------------------------------------
# Continuous Deployment
# Fires automatically after the CI workflow succeeds on `main`, or manually
# via the Actions tab (workflow_dispatch) where you can pick a target.
#
# Flow: publish -> upload artifact -> deploy-linux and/or deploy-windows.
# All server credentials come from GitHub Secrets (never hard-coded).
# ---------------------------------------------------------------------------

on:
  # Run only after CI finished successfully.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger with a deployment-target selector.
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'both'
        type: choice
        options: [linux, windows, both]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never interrupt an in-flight deploy

env:
  DOTNET_VERSION: '10.0.x'     # keep in sync with ci.yml / the projects
  DOTNET_CONFIGURATION: 'Release'
  MVC_PROJECT: 'mvc web/DevOps.csproj'
  API_PROJECT: 'web api/web api.csproj'
  ARTIFACT_NAME: 'app-publish'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  # -------------------------------------------------------------------------
  # 1. PUBLISH — produce a deployable build and store it as an artifact.
  # -------------------------------------------------------------------------
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Skip if triggered by a CI run that did NOT succeed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Publish each project into its own subfolder of ./publish.
      # Framework-dependent (the target host has the ASP.NET Core runtime).
      - name: Publish MVC app
        run: >-
          dotnet publish "$MVC_PROJECT"
          --configuration $DOTNET_CONFIGURATION
          --output ./publish/mvc

      - name: Publish Web API
        run: >-
          dotnet publish "$API_PROJECT"
          --configuration $DOTNET_CONFIGURATION
          --output ./publish/api

      # One artifact containing both apps: publish/mvc and publish/api.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./publish
          retention-days: 7

  # -------------------------------------------------------------------------
  # 2b. DEPLOY TO WINDOWS (IIS) — runs on a SELF-HOSTED runner installed on the
  #     target machine, so it can write directly to the local IIS site folders.
  #     Deploys BOTH apps: MVC -> MVC_DEPLOY_PATH, API -> API_DEPLOY_PATH.
  # -------------------------------------------------------------------------
  deploy-windows:
    name: Deploy → Windows (IIS, self-hosted)
    needs: publish
    # Requires a self-hosted runner registered with these labels on your machine.
    runs-on: [self-hosted, windows]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(fromJSON('["windows","both"]'), github.event.inputs.target)
    environment: production-windows
    env:
      # Physical paths of the two IIS sites on this machine.
      MVC_DEPLOY_PATH: 'D:\DevOps\test'
      API_DEPLOY_PATH: 'D:\DevOps\api'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .\publish

      - name: Deploy to local IIS sites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Deploy-App($sourceRel, $dest) {
            $source = (Resolve-Path $sourceRel).Path
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            # /MIR mirrors and removes stale files. Add /XF appsettings.Production.json to keep server secrets.
            robocopy $source $dest /MIR /NFL /NDL /NJH /NJS /NP /R:3 /W:5
            # robocopy exit codes 0-7 are success; >=8 is a real failure.
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $dest with exit code $LASTEXITCODE" }
            Write-Host "Deployed to $dest"
          }

          Deploy-App ".\publish\mvc" "$env:MVC_DEPLOY_PATH"
          Deploy-App ".\publish\api" "$env:API_DEPLOY_PATH"

          # robocopy returns 1-7 on success; normalize so the step doesn't fail.
          exit 0

name: Build & Test (CI)

# Show the pull request title (for PR runs) or the commit message (for pushes)
# in the Actions run list, instead of the default run name.
run-name: >-
  CI · ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}

# ---------------------------------------------------------------------------
# Continuous Integration
# Runs on every push and pull request targeting dev, staging, or hotfix.
# Responsibilities: restore -> build -> test.
# The Continuous Deployment workflow (deploy-applications.yml) runs once this
# workflow succeeds.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [dev, staging, hotfix]
    # Don't build when a commit changes ONLY workflow files (nothing to compile).
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches: [dev, staging, hotfix]
    paths-ignore:
      - '.github/workflows/**'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # SDKs: Web + API target net10.0; SSO + WindowsService target net8.0.
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  # Solution that references all projects (Web + API + Domain).
  SOLUTION_FILE: 'rn-ci-cd.sln'
  BUILD_CONFIGURATION: 'Release'
  # Speed up runs and keep logs clean.
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-and-test:
    name: Build & Test Solution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache the NuGet package store keyed on project files so restores are
      # fast on subsequent runs.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_FILE"

      - name: Build solution
        run: dotnet build "$SOLUTION_FILE" --configuration "$BUILD_CONFIGURATION" --no-restore

      # Runs tests when a test project exists; otherwise skips without failing.
      - name: Run tests
        run: |
          if ls **/*[Tt]est*.csproj >/dev/null 2>&1; then
            dotnet test "$SOLUTION_FILE" --configuration "$BUILD_CONFIGURATION" --no-build \
              --verbosity normal --logger "trx;LogFileName=test-results.trx"
          else
            echo "No test projects found — skipping. Add one to enable tests."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

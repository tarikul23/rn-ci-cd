name: Provision Deploy Environments

# ---------------------------------------------------------------------------
# One-time (manually triggered) provisioning of the per-app, per-branch
# GitHub Environments used by deploy-applications.yml (4 apps x 3 branches):
#
#   web-dev  api-dev  sso-dev  svc-dev
#   web-staging  api-staging  sso-staging  svc-staging
#   web-hotfix   api-hotfix   sso-hotfix   svc-hotfix
#
# For each it sets:
#   - the deploy-path VARIABLE (WEB_/API_/SSO_/SVC_DEPLOY_PATH)
#   - the credential SECRETS  (DEPLOY_USER / DEPLOY_PASSWORD) if provided
#   - (optionally) Required reviewers, so every app is approved separately
#
# WHY A PAT: managing variables/secrets/environments needs admin rights that
# the built-in GITHUB_TOKEN does not have. Store a PAT as GH_ADMIN_TOKEN.
#
# PREREQUISITES (repo-level — Settings → Secrets and variables → Actions):
#   Secret  GH_ADMIN_TOKEN   PAT with 'repo' + admin (classic), OR fine-grained
#                            with Administration + Secrets + Environments +
#                            Variables = read/write.
#   Secret  DEPLOY_USER      (optional) username for remote UNC shares.
#   Secret  DEPLOY_PASSWORD  (optional) password for the above.
#   Var     REVIEWERS        (optional) comma-separated GitHub usernames to set
#                            as Required reviewers when 'set_reviewers' is true.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      set_reviewers:
        description: 'Also set Required reviewers from the REVIEWERS variable?'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provision:
    name: Provision environments & config
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      REPO: ${{ github.repository }}
      # One entry per line:  <environment>|<variableName>|<deployPath>
      # Edit the paths to match your servers. '|' is the delimiter so Windows
      # drive-letter colons in the paths are preserved.
      ENV_CONFIG: |
        web-dev|WEB_DEPLOY_PATH|D:\DevOps\dev\web
        api-dev|API_DEPLOY_PATH|D:\DevOps\dev\api
        sso-dev|SSO_DEPLOY_PATH|D:\DevOps\dev\sso
        svc-dev|SVC_DEPLOY_PATH|D:\DevOps\dev\svc
        web-staging|WEB_DEPLOY_PATH|D:\DevOps\staging\web
        api-staging|API_DEPLOY_PATH|D:\DevOps\staging\api
        sso-staging|SSO_DEPLOY_PATH|D:\DevOps\staging\sso
        svc-staging|SVC_DEPLOY_PATH|D:\DevOps\staging\svc
        web-hotfix|WEB_DEPLOY_PATH|D:\DevOps\hotfix\web
        api-hotfix|API_DEPLOY_PATH|D:\DevOps\hotfix\api
        sso-hotfix|SSO_DEPLOY_PATH|D:\DevOps\hotfix\sso
        svc-hotfix|SVC_DEPLOY_PATH|D:\DevOps\hotfix\svc
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      REVIEWERS: ${{ vars.REVIEWERS }}
      SET_REVIEWERS: ${{ inputs.set_reviewers }}
    steps:
      # A non-empty secret proves nothing — the token still has to authenticate
      # AND hold admin on this repo. Check both here so a bad token fails in the
      # first seconds with a precise message, not mid-way through provisioning.
      - name: Verify admin token
        run: |
          set -uo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Repo secret GH_ADMIN_TOKEN is not set. Create a PAT with admin rights first."
            exit 1
          fi

          # Pasting a token with a trailing newline/space is a common cause of 401.
          if [ "$GH_TOKEN" != "$(printf '%s' "$GH_TOKEN" | tr -d '[:space:]')" ]; then
            echo "::warning::GH_ADMIN_TOKEN contains whitespace. If authentication fails, re-paste the secret with no leading/trailing spaces or newline."
          fi

          # --- does the token authenticate at all? ---------------------------
          if ! out="$(gh api -i user 2>&1)"; then
            echo "$out"
            if printf '%s' "$out" | grep -qi 'bad credentials'; then
              echo "::error::GH_ADMIN_TOKEN is invalid, expired or revoked (HTTP 401). Generate a new PAT and update the secret: Settings -> Secrets and variables -> Actions -> GH_ADMIN_TOKEN."
            else
              echo "::error::Could not authenticate with GH_ADMIN_TOKEN. See the response above."
            fi
            exit 1
          fi

          login="$(gh api user --jq '.login' 2>/dev/null || echo '?')"
          scopes="$(printf '%s' "$out" | grep -i '^x-oauth-scopes:' | cut -d: -f2- | tr -d ' \r')"
          echo "Authenticated as: $login"
          echo "Token scopes:     ${scopes:-(none reported - fine-grained token)}"

          # --- does it have admin on THIS repo? ------------------------------
          if ! admin="$(gh api "repos/$REPO" --jq '.permissions.admin' 2>/dev/null)"; then
            echo "::error::Token authenticated as '$login' but cannot see $REPO. A classic PAT needs the 'repo' scope; a fine-grained PAT must grant this repository access."
            exit 1
          fi
          if [ "$admin" != "true" ]; then
            echo "::error::Token authenticated as '$login' but has no admin on $REPO. Creating environments, variables and secrets requires admin. Classic PAT: 'repo' + 'admin:org' if org-owned. Fine-grained PAT: Administration=RW, Environments=RW, Secrets=RW, Variables=RW."
            exit 1
          fi
          echo "Admin on $REPO:   yes"

      - name: Provision environments, variables, secrets (and reviewers)
        run: |
          set -euo pipefail

          # Turns a gh error into something actionable.
          explain_failure() {
            local msg="$1" env="$2"
            if printf '%s' "$msg" | grep -qi 'bad credentials'; then
              echo "::error::GH_ADMIN_TOKEN was rejected (HTTP 401) while creating '$env'. The token is invalid, expired or revoked — generate a new PAT and update the secret."
            elif printf '%s' "$msg" | grep -qiE 'not accessible|forbidden|403'; then
              echo "::error::GH_ADMIN_TOKEN authenticated but is not allowed to create environment '$env' (HTTP 403). It needs admin: classic PAT 'repo' scope, or fine-grained with Administration=RW and Environments=RW."
            elif printf '%s' "$msg" | grep -qiE 'protection rules|not available|upgrade'; then
              echo "::error::Environment '$env' was created but a protection rule was refused. Required reviewers need GitHub Pro/Team/Enterprise on a private repo — re-run with set_reviewers = false."
            else
              echo "::error::Failed to provision environment '$env'. See the response above."
            fi
          }

          # Optionally resolve reviewer usernames -> user IDs for protection rules.
          reviewerJson=""
          if [ "$SET_REVIEWERS" = "true" ] && [ -n "${REVIEWERS// }" ]; then
            IFS=',' read -ra names <<< "$REVIEWERS"
            for n in "${names[@]}"; do
              n="$(echo "$n" | xargs)"; [ -z "$n" ] && continue
              id="$(gh api "users/$n" --jq '.id')"
              reviewerJson="${reviewerJson}{\"type\":\"User\",\"id\":$id},"
            done
            reviewerJson="${reviewerJson%,}"
            echo "Reviewers to apply: $REVIEWERS"
          fi

          while IFS='|' read -r envName varName deployPath; do
            envName="$(echo "$envName" | xargs)"
            [ -z "$envName" ] && continue
            varName="$(echo "$varName" | xargs)"
            deployPath="$(echo "$deployPath" | sed -e 's/^[[:space:]]*//')"
            echo "== $envName =="

            # Create/update the environment (idempotent). Include reviewers if set.
            # Explain the failure rather than letting `set -e` kill the run with
            # a bare gh error.
            if [ -n "$reviewerJson" ]; then
              if ! err="$(printf '{"reviewers":[%s]}' "$reviewerJson" \
                  | gh api --method PUT "repos/$REPO/environments/$envName" --input - 2>&1 >/dev/null)"; then
                echo "$err"
                explain_failure "$err" "$envName"
                exit 1
              fi
              echo "  environment ready (with reviewers)"
            else
              if ! err="$(gh api --method PUT "repos/$REPO/environments/$envName" 2>&1 >/dev/null)"; then
                echo "$err"
                explain_failure "$err" "$envName"
                exit 1
              fi
              echo "  environment ready"
            fi

            # Deploy-path VARIABLE (non-sensitive).
            gh variable set "$varName" --env "$envName" --repo "$REPO" --body "$deployPath"
            echo "  var $varName = $deployPath"

            # Credential SECRETS (only if provided at repo level).
            if [ -n "${DEPLOY_USER// }" ]; then
              gh secret set DEPLOY_USER     --env "$envName" --repo "$REPO" --body "$DEPLOY_USER"
              gh secret set DEPLOY_PASSWORD --env "$envName" --repo "$REPO" --body "$DEPLOY_PASSWORD"
              echo "  secrets DEPLOY_USER / DEPLOY_PASSWORD set"
            fi
          done <<< "$ENV_CONFIG"

          echo "Done. Verify at: https://github.com/$REPO/settings/environments"

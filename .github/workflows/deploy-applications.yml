name: Deploy Applications (CD)

# Show the branch + the title/commit that triggered CI (or the actor for a
# manual run) in the Actions run list. `display_title` carries the PR title or
# commit message from the CI run through to CD.
run-name: >-
  CD → ${{ github.event.workflow_run.head_branch || github.ref_name }}:
  ${{ github.event.workflow_run.display_title || format('manual by {0}', github.actor) }}

# ---------------------------------------------------------------------------
# Continuous Deployment (multi-branch: dev / staging / hotfix)
#
# Fires after CI succeeds on dev, staging, or hotfix — or manually via the
# Actions tab. Each app+branch uses its OWN GitHub Environment, so Web and API
# have SEPARATE Required reviewers (approved independently) and separate
# variables/secrets (never hard-coded):
#
#   app+branch      -> environment -> config used
#   web + dev       -> web-dev     -> var: MVC_DEPLOY_PATH  + secrets: creds
#   api + dev       -> api-dev     -> var: API_DEPLOY_PATH  + secrets: creds
#   web + staging   -> web-staging -> var: MVC_DEPLOY_PATH  + secrets: creds
#   api + staging   -> api-staging -> var: API_DEPLOY_PATH  + secrets: creds
#   web + hotfix    -> web-hotfix  -> var: MVC_DEPLOY_PATH  + secrets: creds
#   api + hotfix    -> api-hotfix  -> var: API_DEPLOY_PATH  + secrets: creds
#
# Change-based deployment:
#   - only mvc web/**  changed -> deploy Web only
#   - only web api/**  changed -> deploy API only
#   - Domain/**        changed -> deploy BOTH (Web + API reference Domain)
#   - nothing relevant changed -> jobs are skipped
#
# Flow (two independent lanes after detect-changes):
#   detect-changes ─┬─ publish-web ─ deploy-web
#                   └─ publish-api ─ deploy-api
# ---------------------------------------------------------------------------

on:
  # Run only after CI finished successfully on one of these branches.
  # NOTE: this must match the CI workflow's `name:` exactly.
  workflow_run:
    workflows: ["Build & Test (CI)"]
    types: [completed]
    branches: [dev, staging, hotfix]
  # Manual trigger: force-deploy ONE application on the branch you run it from.
  # Deploy each application separately — run once for web, again for api.
  workflow_dispatch:
    inputs:
      application:
        description: 'Application to deploy'
        required: true
        default: 'web'
        type: choice
        options: [web, api]

concurrency:
  # One in-flight deploy per branch; never interrupt an active deploy.
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'          # keep in sync with build-and-test.yml / the projects
  DOTNET_CONFIGURATION: 'Release'
  MVC_PROJECT: 'mvc web/DevOps.csproj'
  API_PROJECT: 'web api/web api.csproj'
  MVC_ARTIFACT: 'app-publish-mvc'
  API_ARTIFACT: 'app-publish-api'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  # Exclusion lists (files/folders NOT to overwrite or purge on the target) are
  # read PER APP from GitHub Actions Variables, with the defaults below as a
  # fallback. Configure them in the UI without editing this file:
  #   Settings → Secrets and variables → Actions → Variables (repo-wide), or
  #   Settings → Environments → <env> → Variables (per branch/environment).
  # Variable names: WEB_EXCLUDE_FILES / WEB_EXCLUDE_DIRS
  #                 API_EXCLUDE_FILES / API_EXCLUDE_DIRS
  # Entries may be separated by new lines OR commas; wildcards allowed.

jobs:
  # -------------------------------------------------------------------------
  # 0. DETECT CHANGES + TARGET BRANCH.
  #    Decides which projects to deploy and which environment (= branch) to
  #    deploy to. A Domain/** change fans out to BOTH apps.
  # -------------------------------------------------------------------------
  detect-changes:
    name: Detect changes & target
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      web: ${{ steps.decide.outputs.web }}
      api: ${{ steps.decide.outputs.api }}
      environment: ${{ steps.decide.outputs.environment }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff against the parent commit
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Decide projects & environment
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          web=false
          api=false

          # Branch that triggered CI (auto) or that dispatch was run from (manual).
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo "Target branch / environment: $BRANCH"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: operator deploys exactly ONE application.
            case "${{ github.event.inputs.application }}" in
              web) web=true ;;
              api) api=true ;;
            esac
          else
            # Auto run: diff the pushed commit against its first parent.
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || echo '')"
            if [ -z "$BASE_SHA" ]; then
              web=true; api=true          # no parent (first commit) -> deploy all
            else
              CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
              echo "Changed files:"; echo "$CHANGED"

              # Shared Domain project -> redeploy BOTH apps.
              domain=false
              echo "$CHANGED" | grep -q '^Domain/'  && domain=true || true
              echo "$CHANGED" | grep -q '^mvc web/' && web=true    || true
              echo "$CHANGED" | grep -q '^web api/' && api=true    || true
              if [ "$domain" = "true" ]; then web=true; api=true; fi
            fi
          fi

          echo "web=$web"                 >> "$GITHUB_OUTPUT"
          echo "api=$api"                 >> "$GITHUB_OUTPUT"
          echo "environment=$BRANCH"      >> "$GITHUB_OUTPUT"
          echo "::notice::branch=$BRANCH  deploy-web=$web  deploy-api=$api"

  # -------------------------------------------------------------------------
  # 1a. PUBLISH WEB — build & package the Web app. Runs only if Web changed.
  #     Starts the Web lane, independent of the API lane.
  # -------------------------------------------------------------------------
  publish-web:
    name: Publish Web
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish MVC app
        run: >-
          dotnet publish "$MVC_PROJECT"
          --configuration $DOTNET_CONFIGURATION
          --output ./publish/mvc

      - name: Upload MVC artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MVC_ARTIFACT }}
          path: ./publish/mvc
          retention-days: 7

  # -------------------------------------------------------------------------
  # 1b. PUBLISH API — build & package the API. Runs only if the API changed.
  #     Starts the API lane, independent of the Web lane.
  # -------------------------------------------------------------------------
  publish-api:
    name: Publish API
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.api == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Web API
        run: >-
          dotnet publish "$API_PROJECT"
          --configuration $DOTNET_CONFIGURATION
          --output ./publish/api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT }}
          path: ./publish/api
          retention-days: 7

  # -------------------------------------------------------------------------
  # 2a. DEPLOY WEB — self-hosted Windows runner. Uses the app-specific
  #     environment `web-<branch>` (e.g. web-dev), which holds the Web deploy
  #     path variable AND its own Required reviewers — so Web is approved
  #     SEPARATELY from the API. Only runs if Web changed.
  # -------------------------------------------------------------------------
  deploy-web:
    name: Deploy Web (${{ needs.detect-changes.outputs.environment }})
    needs: [detect-changes, publish-web]
    runs-on: [self-hosted, windows]
    if: needs.detect-changes.outputs.web == 'true'
    environment: web-${{ needs.detect-changes.outputs.environment }}
    steps:
      - name: Download MVC artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MVC_ARTIFACT }}
          path: .\publish\mvc

      # Execution-policy override so the runner can't block the temp script.
      - name: Deploy MVC
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        env:
          DEST:            ${{ vars.MVC_DEPLOY_PATH }}
          DEPLOY_USER:     ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          EXCLUDE_FILES:   ${{ vars.WEB_EXCLUDE_FILES || 'appsettings.json,appsettings.*.json' }}
          EXCLUDE_DIRS:    ${{ vars.WEB_EXCLUDE_DIRS  || 'uploads' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DEST)) { throw "MVC_DEPLOY_PATH variable is not set for this environment." }
          $source = (Resolve-Path ".\publish\mvc").Path
          $dest   = $env:DEST

          # If the target is a remote UNC share and credentials are provided,
          # authenticate to it first (local D:\ paths skip this).
          $mappedRoot = $null
          if ($dest -like '\\*' -and $env:DEPLOY_USER) {
            $parts = $dest.TrimStart('\').Split('\')
            $mappedRoot = "\\$($parts[0])\$($parts[1])"
            net use $mappedRoot /user:$env:DEPLOY_USER $env:DEPLOY_PASSWORD | Out-Null
          }
          try {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null

            # Preserve server-managed files/folders: /XF and /XD exclude them
            # from BOTH the copy and the /MIR purge, so existing copies survive.
            # Entries may be separated by new lines, commas, or semicolons.
            $excludeFiles = $env:EXCLUDE_FILES -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            $excludeDirs  = $env:EXCLUDE_DIRS  -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ } | ForEach-Object { Join-Path $dest $_ }

            $roboArgs = @('/MIR','/NFL','/NDL','/NJH','/NJS','/NP','/R:3','/W:5')
            if ($excludeFiles) { $roboArgs += '/XF'; $roboArgs += $excludeFiles }
            if ($excludeDirs)  { $roboArgs += '/XD'; $roboArgs += $excludeDirs }

            robocopy $source $dest @roboArgs
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $dest (exit $LASTEXITCODE)" }
            Write-Host "Deployed Web to $dest (preserved: $env:EXCLUDE_FILES $env:EXCLUDE_DIRS)"
          }
          finally {
            if ($mappedRoot) { net use $mappedRoot /delete /y | Out-Null }
          }
          exit 0

  # -------------------------------------------------------------------------
  # 2b. DEPLOY API — self-hosted Windows runner. Uses the app-specific
  #     environment `api-<branch>` (e.g. api-dev), with its own API deploy
  #     path variable AND its own Required reviewers — approved SEPARATELY
  #     from the Web app. Only runs if the API changed.
  # -------------------------------------------------------------------------
  deploy-api:
    name: Deploy API (${{ needs.detect-changes.outputs.environment }})
    needs: [detect-changes, publish-api]
    runs-on: [self-hosted, windows]
    if: needs.detect-changes.outputs.api == 'true'
    environment: api-${{ needs.detect-changes.outputs.environment }}
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT }}
          path: .\publish\api

      - name: Deploy API
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        env:
          DEST:            ${{ vars.API_DEPLOY_PATH }}
          DEPLOY_USER:     ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          EXCLUDE_FILES:   ${{ vars.API_EXCLUDE_FILES || 'appsettings.json,appsettings.*.json' }}
          EXCLUDE_DIRS:    ${{ vars.API_EXCLUDE_DIRS  || 'uploads' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DEST)) { throw "API_DEPLOY_PATH variable is not set for this environment." }
          $source = (Resolve-Path ".\publish\api").Path
          $dest   = $env:DEST

          $mappedRoot = $null
          if ($dest -like '\\*' -and $env:DEPLOY_USER) {
            $parts = $dest.TrimStart('\').Split('\')
            $mappedRoot = "\\$($parts[0])\$($parts[1])"
            net use $mappedRoot /user:$env:DEPLOY_USER $env:DEPLOY_PASSWORD | Out-Null
          }
          try {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null

            # Preserve server-managed files/folders: /XF and /XD exclude them
            # from BOTH the copy and the /MIR purge, so existing copies survive.
            # Entries may be separated by new lines, commas, or semicolons.
            $excludeFiles = $env:EXCLUDE_FILES -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            $excludeDirs  = $env:EXCLUDE_DIRS  -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ } | ForEach-Object { Join-Path $dest $_ }

            $roboArgs = @('/MIR','/NFL','/NDL','/NJH','/NJS','/NP','/R:3','/W:5')
            if ($excludeFiles) { $roboArgs += '/XF'; $roboArgs += $excludeFiles }
            if ($excludeDirs)  { $roboArgs += '/XD'; $roboArgs += $excludeDirs }

            robocopy $source $dest @roboArgs
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $dest (exit $LASTEXITCODE)" }
            Write-Host "Deployed API to $dest (preserved: $env:EXCLUDE_FILES $env:EXCLUDE_DIRS)"
          }
          finally {
            if ($mappedRoot) { net use $mappedRoot /delete /y | Out-Null }
          }
          exit 0

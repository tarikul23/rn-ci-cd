name: CI

# ---------------------------------------------------------------------------
# Continuous Integration
# Runs on every push and pull request targeting dev, staging, or hotfix.
# Responsibilities: restore -> build -> test.
# The CD workflow (cd.yml) is triggered automatically once this succeeds.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [dev, staging, hotfix]
  pull_request:
    branches: [dev, staging, hotfix]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the SDK version. Projects target net10.0.
  DOTNET_VERSION: '10.0.x'
  # Solution that references all projects (mvc web + web api + Domain).
  SOLUTION: 'rn-ci-cd.sln'
  DOTNET_CONFIGURATION: 'Release'
  # Speed up runs and keep logs clean.
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository contents onto the runner.
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install the requested .NET SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Cache the NuGet package store keyed on project files
      #    so restores are fast on subsequent runs.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # 4. Restore NuGet dependencies for the whole solution.
      - name: Restore dependencies
        run: dotnet restore "$SOLUTION"

      # 5. Compile the solution. --no-restore skips a redundant restore.
      - name: Build
        run: dotnet build "$SOLUTION" --configuration $DOTNET_CONFIGURATION --no-restore

      # 6. Run tests. Won't fail the build when no test project exists yet;
      #    add a *.Tests project and it is picked up automatically.
      - name: Test
        run: |
          if ls **/*[Tt]est*.csproj >/dev/null 2>&1; then
            dotnet test "$SOLUTION" --configuration $DOTNET_CONFIGURATION --no-build \
              --verbosity normal --logger "trx;LogFileName=test-results.trx"
          else
            echo "No test projects found — skipping. Add one to enable tests."
          fi

      # 7. Publish test results as an artifact when they exist.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

name: Deploy Applications (CD - Manual Approval)

# Run title: "<target branch> — ticked apps — by <actor>".
run-name: >-
  CD → ${{ inputs.target }} —
  ${{ inputs.deploy_web && 'web ' || '' }}${{ inputs.deploy_api && 'api ' || '' }}${{ inputs.deploy_sso && 'sso ' || '' }}${{ inputs.deploy_svc && 'svc ' || '' }}${{ (inputs.deploy_web || inputs.deploy_api || inputs.deploy_sso || inputs.deploy_svc) && '' || 'changed-only' }}
  — by ${{ github.actor }}

# ---------------------------------------------------------------------------
# Continuous Deployment WITHOUT GitHub "Deployment protection rules".
#
# WHY: Required reviewers is an Environments *protection rule*, unavailable on
# private repos on the Free plan (and to non-admins). Instead of approving a
# run that already started, NOTHING starts on its own: publishing is an act a
# person performs. Pressing "Run workflow" IS the approval.
#
# HOW IT BEHAVES:
#   CI succeeds  ──►  nothing happens here. Check CI is green, then deploy.
#
#   You press "Run workflow" (target branch + app checkboxes + confirm)
#     └─ detect-changes ─┬─ publish-web ─ deploy-web   (Dashboard Web)
#                        ├─ publish-api ─ deploy-api   (MJH API)
#                        ├─ publish-sso ─ deploy-sso   (Dashboard SSO)
#                        └─ publish-svc ─ deploy-svc   (Windows Service)
#
# There is no automatic trigger, so no build is ever packaged and no file is
# ever copied to a server without someone deliberately starting it. GitHub
# records who pressed the button in the run metadata.
#
# Two cheap guards on that press (they are input validation, not a gate job —
# say the word if you want them gone too):
#   - the operator retypes the target branch name into `confirm`
#   - the operator must be listed in the repo variable CD_APPROVERS
#
# Environments (web-dev, api-staging, ...) are still used, but ONLY to hold the
# deploy-path variables — no protection rule required.
#
# ---------------------------------------------------------------------------
# SETUP
#   Repo VARIABLE (Settings -> Secrets and variables -> Actions -> Variables):
#     CD_APPROVERS   comma-separated GitHub logins allowed to deploy, e.g.
#                    "tarikul23,team-lead-login". If EMPTY, anyone with write
#                    access can deploy and the run only logs a warning.
#
#   The file must live on the DEFAULT branch for the Run workflow button to
#   appear. The branch you launch from does not matter — `target` decides what
#   is built.
#
# HONEST LIMIT: anyone with write access can edit this file, and the branch
# selector is only as safe as the branches themselves. Protect dev/staging/
# hotfix with a branch ruleset requiring PR review for `.github/**`.
# ---------------------------------------------------------------------------

on:
  # Manual only — this is the single trigger, and pressing it is the approval.
  # Launch from any branch (main is fine) and pick the target below.
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to deploy (this is what gets built & shipped)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, hotfix]
      # Tick any combination. Leave ALL FOUR unticked to fall back to
      # "changed-only": deploy whatever the branch head's commit touched.
      deploy_web:
        description: 'Dashboard Web   (mvc web/)'
        required: false
        default: false
        type: boolean
      deploy_api:
        description: 'MJH API   (web api/)'
        required: false
        default: false
        type: boolean
      deploy_sso:
        description: 'Dashboard SSO   (SSO/)'
        required: false
        default: false
        type: boolean
      deploy_svc:
        description: 'Windows Service   (WindowsService/)'
        required: false
        default: false
        type: boolean
      confirm:
        description: 'Type the target branch name again to confirm'
        required: true
        type: string
      reason:
        description: 'Why are you deploying? (shown in the run summary)'
        required: false
        default: 'manual deployment'
        type: string

concurrency:
  # One in-flight deploy per target branch; never interrupt an active deploy.
  group: cd-${{ github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Multiple SDKs: Web + API target net10.0; SSO + WindowsService target net8.0.
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  DOTNET_CONFIGURATION: 'Release'
  # Project files (source of each application).
  WEB_PROJECT: 'mvc web/DevOps.csproj'
  API_PROJECT: 'web api/web api.csproj'
  SSO_PROJECT: 'SSO/SSO.csproj'
  SVC_PROJECT: 'WindowsService/WindowsService.csproj'
  # Build artifact names (one per application).
  WEB_ARTIFACT: 'dashboard-web'
  API_ARTIFACT: 'mjh-api'
  SSO_ARTIFACT: 'dashboard-sso'
  SVC_ARTIFACT: 'windows-service'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  # =========================================================================
  # 1. DETECT CHANGES + TARGET BRANCH.
  #    Sets a deploy flag per application, the branch (= environment suffix)
  #    and the exact commit every lane will build.
  #    A Domain/** change fans out to ALL four applications.
  # =========================================================================
  detect-changes:
    # Always runs, so its name reliably shows the branch even when every deploy
    # lane is skipped.
    name: Detect changes & target (${{ inputs.target }})
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.decide.outputs.web }}
      api: ${{ steps.decide.outputs.api }}
      sso: ${{ steps.decide.outputs.sso }}
      svc: ${{ steps.decide.outputs.svc }}
      any: ${{ steps.decide.outputs.any }}
      apps: ${{ steps.decide.outputs.apps }}
      environment: ${{ steps.decide.outputs.environment }}
      # Exact commit every publish job builds — pinned here so all four lanes
      # ship the same code even if someone pushes mid-deploy.
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      # -- input validation: not an approval gate, just two cheap guards -------
      - name: Validate request
        shell: bash
        env:
          BRANCH:    ${{ inputs.target }}
          CONFIRM:   ${{ inputs.confirm }}
          ACTOR:     ${{ github.actor }}
          APPROVERS: ${{ vars.CD_APPROVERS }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "$BRANCH" ]; then
            echo "::error::Confirmation mismatch — you typed '$CONFIRM', expected '$BRANCH'. Nothing was deployed."
            exit 1
          fi
          if [ -z "${APPROVERS//[[:space:]]/}" ]; then
            echo "::warning::Repo variable CD_APPROVERS is empty — anyone with write access can deploy."
          elif printf '%s' "$APPROVERS" | tr ',;' '\n\n' | tr -d '[:space:]' | grep -Fqix "$ACTOR"; then
            echo "Operator '$ACTOR' accepted."
          else
            echo "::error::'$ACTOR' is not listed in CD_APPROVERS. Ask an approver to run this deployment."
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff against the parent commit
          # The TARGET branch, not the branch this run was launched from.
          ref: refs/heads/${{ inputs.target }}

      - name: Decide applications & environment
        id: decide
        shell: bash
        env:
          BRANCH: ${{ inputs.target }}
          REASON: ${{ inputs.reason }}
          # Checkboxes arrive as the strings "true" / "false".
          WEB_IN: ${{ inputs.deploy_web }}
          API_IN: ${{ inputs.deploy_api }}
          SSO_IN: ${{ inputs.deploy_sso }}
          SVC_IN: ${{ inputs.deploy_svc }}
        run: |
          set -euo pipefail
          web=false; api=false; sso=false; svc=false
          SHA="$(git rev-parse HEAD)"

          case "$BRANCH" in
            dev|staging|hotfix) ;;
            *) echo "::error::'$BRANCH' is not deployable. Use dev, staging or hotfix."; exit 1 ;;
          esac

          # Ticked boxes win outright — no diffing, deploy exactly what was asked.
          [ "$WEB_IN" = "true" ] && web=true || true
          [ "$API_IN" = "true" ] && api=true || true
          [ "$SSO_IN" = "true" ] && sso=true || true
          [ "$SVC_IN" = "true" ] && svc=true || true

          if [ "$web$api$sso$svc" = "falsefalsefalsefalse" ]; then
            # Nothing ticked -> fall back to what the head commit touched.
            SELECTION="changed-only (nothing ticked)"
            BASE_SHA="$(git rev-parse 'HEAD^' 2>/dev/null || echo '')"
            if [ -z "$BASE_SHA" ]; then
              web=true; api=true; sso=true; svc=true   # first commit -> deploy all
            else
              CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
              echo "Changed files:"; echo "$CHANGED"
              domain=false
              echo "$CHANGED" | grep -q '^Domain/'         && domain=true || true
              echo "$CHANGED" | grep -q '^mvc web/'        && web=true    || true
              echo "$CHANGED" | grep -q '^web api/'        && api=true    || true
              echo "$CHANGED" | grep -q '^SSO/'            && sso=true    || true
              echo "$CHANGED" | grep -q '^WindowsService/' && svc=true    || true
              # Shared Domain project -> redeploy ALL four applications.
              if [ "$domain" = "true" ]; then web=true; api=true; sso=true; svc=true; fi
            fi
          else
            SELECTION="explicitly ticked"
          fi
          echo "Target: $BRANCH @ $SHA (selection: $SELECTION)"

          any=true
          [ "$web$api$sso$svc" = "falsefalsefalsefalse" ] && any=false || true

          # Human-readable list for the run summary.
          apps=""
          [ "$web" = "true" ] && apps="$apps Dashboard Web,"   || true
          [ "$api" = "true" ] && apps="$apps MJH API,"         || true
          [ "$sso" = "true" ] && apps="$apps Dashboard SSO,"   || true
          [ "$svc" = "true" ] && apps="$apps Windows Service," || true
          apps="$(echo "$apps" | sed 's/^ *//; s/,$//')"
          [ -n "$apps" ] || apps="(none)"

          {
            echo "web=$web"
            echo "api=$api"
            echo "sso=$sso"
            echo "svc=$svc"
            echo "any=$any"
            echo "apps=$apps"
            echo "environment=$BRANCH"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::branch=$BRANCH sha=${SHA:0:8} apps=$apps"

          if [ "$any" = "false" ]; then
            {
              echo "## Nothing to deploy"
              echo
              echo "Commit \`${SHA:0:8}\` on \`$BRANCH\` touched no deployable application."
              echo "Tick the application you want on the Run workflow form to force one out regardless of the diff."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Nothing to deploy — the last commit on $BRANCH touched no application."
            exit 1
          fi

          {
            echo "## Deploying"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Started by | @$GITHUB_ACTOR |"
            echo "| Branch | $BRANCH |"
            echo "| Commit | ${SHA:0:8} |"
            echo "| Selection | $SELECTION |"
            echo "| Applications | $apps |"
            echo "| Reason | ${REASON:-(none)} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # PUBLISH LANES — build & package each selected application independently.
  # Reached only because a human pressed "Run workflow" and passed validation.
  # The environment is attached only to supply the deploy-path variable.
  # =========================================================================
  publish-web:
    name: Publish Dashboard Web
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.web == 'true'
    environment: web-${{ needs.detect-changes.outputs.environment }}
    outputs:
      deploy_path: ${{ steps.cfg.outputs.deploy_path }}
    steps:
      - name: Resolve deploy target
        id: cfg
        run: echo "deploy_path=${{ vars.WEB_DEPLOY_PATH }}" >> "$GITHUB_OUTPUT"
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish Dashboard Web
        run: dotnet publish "$WEB_PROJECT" --configuration $DOTNET_CONFIGURATION --output ./publish/web
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WEB_ARTIFACT }}
          path: ./publish/web
          retention-days: 7

  publish-api:
    name: Publish MJH API
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.api == 'true'
    environment: api-${{ needs.detect-changes.outputs.environment }}
    outputs:
      deploy_path: ${{ steps.cfg.outputs.deploy_path }}
    steps:
      - name: Resolve deploy target
        id: cfg
        run: echo "deploy_path=${{ vars.API_DEPLOY_PATH }}" >> "$GITHUB_OUTPUT"
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish MJH API
        run: dotnet publish "$API_PROJECT" --configuration $DOTNET_CONFIGURATION --output ./publish/api
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT }}
          path: ./publish/api
          retention-days: 7

  publish-sso:
    name: Publish Dashboard SSO
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.sso == 'true'
    environment: sso-${{ needs.detect-changes.outputs.environment }}
    outputs:
      deploy_path: ${{ steps.cfg.outputs.deploy_path }}
    steps:
      - name: Resolve deploy target
        id: cfg
        run: echo "deploy_path=${{ vars.SSO_DEPLOY_PATH }}" >> "$GITHUB_OUTPUT"
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish Dashboard SSO
        run: dotnet publish "$SSO_PROJECT" --configuration $DOTNET_CONFIGURATION --output ./publish/sso
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SSO_ARTIFACT }}
          path: ./publish/sso
          retention-days: 7

  publish-svc:
    name: Publish Windows Service
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.svc == 'true'
    environment: svc-${{ needs.detect-changes.outputs.environment }}
    outputs:
      deploy_path: ${{ steps.cfg.outputs.deploy_path }}
      service_name: ${{ steps.cfg.outputs.service_name }}
    steps:
      - name: Resolve deploy target
        id: cfg
        run: |
          echo "deploy_path=${{ vars.SVC_DEPLOY_PATH }}" >> "$GITHUB_OUTPUT"
          echo "service_name=${{ vars.SVC_SERVICE_NAME }}" >> "$GITHUB_OUTPUT"
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish Windows Service
        run: dotnet publish "$SVC_PROJECT" --configuration $DOTNET_CONFIGURATION --output ./publish/svc
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SVC_ARTIFACT }}
          path: ./publish/svc
          retention-days: 7

  # =========================================================================
  # DEPLOY LANES — self-hosted Windows runner. The deploy path comes from the
  # publish job's output, credentials from repository secrets.
  # =========================================================================
  deploy-web:
    name: Deploy Web
    needs: [detect-changes, publish-web]
    runs-on: [self-hosted, windows]
    steps:
      - name: Target
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        run: Write-Host "Deploying Dashboard Web on branch '${{ needs.detect-changes.outputs.environment }}' to '${{ needs.publish-web.outputs.deploy_path }}'"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WEB_ARTIFACT }}
          path: .\publish\web
      - name: Deploy Dashboard Web
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        env:
          DEST:            ${{ needs.publish-web.outputs.deploy_path }}
          DEPLOY_USER:     ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          EXCLUDE_FILES:   ${{ vars.WEB_EXCLUDE_FILES || 'appsettings.json,appsettings.*.json' }}
          EXCLUDE_DIRS:    ${{ vars.WEB_EXCLUDE_DIRS  || 'uploads' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DEST)) { throw "WEB_DEPLOY_PATH variable is not set for this environment." }
          $source = (Resolve-Path ".\publish\web").Path
          $dest   = $env:DEST
          $mappedRoot = $null
          if ($dest -like '\\*' -and $env:DEPLOY_USER) {
            $parts = $dest.TrimStart('\').Split('\'); $mappedRoot = "\\$($parts[0])\$($parts[1])"
            net use $mappedRoot /user:$env:DEPLOY_USER $env:DEPLOY_PASSWORD | Out-Null
          }
          try {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $excludeFiles = $env:EXCLUDE_FILES -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            $excludeDirs  = $env:EXCLUDE_DIRS  -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ } | ForEach-Object { Join-Path $dest $_ }
            $roboArgs = @('/MIR','/NFL','/NDL','/NJH','/NJS','/NP','/R:3','/W:5')
            if ($excludeFiles) { $roboArgs += '/XF'; $roboArgs += $excludeFiles }
            if ($excludeDirs)  { $roboArgs += '/XD'; $roboArgs += $excludeDirs }
            robocopy $source $dest @roboArgs
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $dest (exit $LASTEXITCODE)" }
            Write-Host "Deployed Dashboard Web to $dest"
          }
          finally { if ($mappedRoot) { net use $mappedRoot /delete /y | Out-Null } }
          exit 0

  deploy-api:
    name: Deploy API
    needs: [detect-changes, publish-api]
    runs-on: [self-hosted, windows]
    steps:
      - name: Target
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        run: Write-Host "Deploying MJH API on branch '${{ needs.detect-changes.outputs.environment }}' to '${{ needs.publish-api.outputs.deploy_path }}'"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_ARTIFACT }}
          path: .\publish\api
      - name: Deploy MJH API
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        env:
          DEST:            ${{ needs.publish-api.outputs.deploy_path }}
          DEPLOY_USER:     ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          EXCLUDE_FILES:   ${{ vars.API_EXCLUDE_FILES || 'appsettings.json,appsettings.*.json' }}
          EXCLUDE_DIRS:    ${{ vars.API_EXCLUDE_DIRS  || 'uploads' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DEST)) { throw "API_DEPLOY_PATH variable is not set for this environment." }
          $source = (Resolve-Path ".\publish\api").Path
          $dest   = $env:DEST
          $mappedRoot = $null
          if ($dest -like '\\*' -and $env:DEPLOY_USER) {
            $parts = $dest.TrimStart('\').Split('\'); $mappedRoot = "\\$($parts[0])\$($parts[1])"
            net use $mappedRoot /user:$env:DEPLOY_USER $env:DEPLOY_PASSWORD | Out-Null
          }
          try {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $excludeFiles = $env:EXCLUDE_FILES -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            $excludeDirs  = $env:EXCLUDE_DIRS  -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ } | ForEach-Object { Join-Path $dest $_ }
            $roboArgs = @('/MIR','/NFL','/NDL','/NJH','/NJS','/NP','/R:3','/W:5')
            if ($excludeFiles) { $roboArgs += '/XF'; $roboArgs += $excludeFiles }
            if ($excludeDirs)  { $roboArgs += '/XD'; $roboArgs += $excludeDirs }
            robocopy $source $dest @roboArgs
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $dest (exit $LASTEXITCODE)" }
            Write-Host "Deployed MJH API to $dest"
          }
          finally { if ($mappedRoot) { net use $mappedRoot /delete /y | Out-Null } }
          exit 0

  deploy-sso:
    name: Deploy SSO
    needs: [detect-changes, publish-sso]
    runs-on: [self-hosted, windows]
    steps:
      - name: Target
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        run: Write-Host "Deploying Dashboard SSO on branch '${{ needs.detect-changes.outputs.environment }}' to '${{ needs.publish-sso.outputs.deploy_path }}'"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SSO_ARTIFACT }}
          path: .\publish\sso
      - name: Deploy Dashboard SSO
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        env:
          DEST:            ${{ needs.publish-sso.outputs.deploy_path }}
          DEPLOY_USER:     ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          EXCLUDE_FILES:   ${{ vars.SSO_EXCLUDE_FILES || 'appsettings.json,appsettings.*.json' }}
          EXCLUDE_DIRS:    ${{ vars.SSO_EXCLUDE_DIRS  || 'uploads' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DEST)) { throw "SSO_DEPLOY_PATH variable is not set for this environment." }
          $source = (Resolve-Path ".\publish\sso").Path
          $dest   = $env:DEST
          $mappedRoot = $null
          if ($dest -like '\\*' -and $env:DEPLOY_USER) {
            $parts = $dest.TrimStart('\').Split('\'); $mappedRoot = "\\$($parts[0])\$($parts[1])"
            net use $mappedRoot /user:$env:DEPLOY_USER $env:DEPLOY_PASSWORD | Out-Null
          }
          try {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $excludeFiles = $env:EXCLUDE_FILES -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            $excludeDirs  = $env:EXCLUDE_DIRS  -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ } | ForEach-Object { Join-Path $dest $_ }
            $roboArgs = @('/MIR','/NFL','/NDL','/NJH','/NJS','/NP','/R:3','/W:5')
            if ($excludeFiles) { $roboArgs += '/XF'; $roboArgs += $excludeFiles }
            if ($excludeDirs)  { $roboArgs += '/XD'; $roboArgs += $excludeDirs }
            robocopy $source $dest @roboArgs
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $dest (exit $LASTEXITCODE)" }
            Write-Host "Deployed Dashboard SSO to $dest"
          }
          finally { if ($mappedRoot) { net use $mappedRoot /delete /y | Out-Null } }
          exit 0

  # Windows Service: stop the service before copying (files are locked while
  # running), then restart it. Set the service name in vars.SVC_SERVICE_NAME.
  deploy-svc:
    name: Deploy SVC
    needs: [detect-changes, publish-svc]
    runs-on: [self-hosted, windows]
    steps:
      - name: Target
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        run: Write-Host "Deploying Windows Service '${{ needs.publish-svc.outputs.service_name }}' on branch '${{ needs.detect-changes.outputs.environment }}' to '${{ needs.publish-svc.outputs.deploy_path }}'"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SVC_ARTIFACT }}
          path: .\publish\svc
      - name: Deploy Windows Service
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
        env:
          DEST:            ${{ needs.publish-svc.outputs.deploy_path }}
          SERVICE_NAME:    ${{ needs.publish-svc.outputs.service_name }}
          DEPLOY_USER:     ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          EXCLUDE_FILES:   ${{ vars.SVC_EXCLUDE_FILES || 'appsettings.json,appsettings.*.json' }}
          EXCLUDE_DIRS:    ${{ vars.SVC_EXCLUDE_DIRS  || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DEST)) { throw "SVC_DEPLOY_PATH variable is not set for this environment." }
          $source = (Resolve-Path ".\publish\svc").Path
          $dest   = $env:DEST
          $svcName = $env:SERVICE_NAME
          $mappedRoot = $null
          if ($dest -like '\\*' -and $env:DEPLOY_USER) {
            $parts = $dest.TrimStart('\').Split('\'); $mappedRoot = "\\$($parts[0])\$($parts[1])"
            net use $mappedRoot /user:$env:DEPLOY_USER $env:DEPLOY_PASSWORD | Out-Null
          }
          try {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null

            # Stop the service so its binaries can be replaced.
            $svcObj = $null
            if ($svcName) { $svcObj = Get-Service -Name $svcName -ErrorAction SilentlyContinue }
            if ($svcObj -and $svcObj.Status -ne 'Stopped') {
              Write-Host "Stopping service $svcName ..."
              Stop-Service -Name $svcName -Force
              (Get-Service -Name $svcName).WaitForStatus('Stopped', '00:01:00')
            }

            $excludeFiles = $env:EXCLUDE_FILES -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            $excludeDirs  = $env:EXCLUDE_DIRS  -split '[\r\n,;]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ } | ForEach-Object { Join-Path $dest $_ }
            $roboArgs = @('/MIR','/NFL','/NDL','/NJH','/NJS','/NP','/R:3','/W:5')
            if ($excludeFiles) { $roboArgs += '/XF'; $roboArgs += $excludeFiles }
            if ($excludeDirs)  { $roboArgs += '/XD'; $roboArgs += $excludeDirs }
            robocopy $source $dest @roboArgs
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $dest (exit $LASTEXITCODE)" }

            # Restart the service if we stopped it (or it exists).
            if ($svcObj) {
              Write-Host "Starting service $svcName ..."
              Start-Service -Name $svcName
            }
            Write-Host "Deployed Windows Service to $dest"
          }
          finally { if ($mappedRoot) { net use $mappedRoot /delete /y | Out-Null } }
          exit 0
